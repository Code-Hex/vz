name: Build
on:
  push:
    paths-ignore:
      - example/**
      - README.md
    branches:
      - "main"
  pull_request:
    paths-ignore:
      - example/**
      - README.md
env:
  GOTOOLCHAIN: local
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install actions lock verifier
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh extension install github/gh-actions-lock --pin v0.4.0
    - name: Verify actions lock
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh actions-lock --verify
    - name: Run clang-format style check for Objective-C files.
      uses: jidicula/clang-format-action@v4.18.0
      with:
        clang-format-version: '13'
  generated-code:
    name: Generated code reproducibility (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Verify saved metadata
        run: go test ./cmd/vzbridgegen ./internal/vzbridge/nativegen -run '^TestMetadata' -count=1
      - name: Regenerate bindings
        run: |
          go run ./cmd/vzbridgegen
          go run ./internal/vzbridge/nativegen -input cmd/vzbridgegen/metadata/native.json -header internal/vzbridge/native.h -output internal/vzbridge/native_bindings.go
          git diff --exit-code -- internal/vzbridge
          test -z "$(git ls-files --others --exclude-standard -- internal/vzbridge)"
  build:
    needs: formatting-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
        - macos-15-intel
        - macos-26
        - xcode-27
        go:
        - '1.26.x'
        - '1.27.x'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: vet
        run: go vet ./...
      - name: Test binding generators
        run: |
          go test ./cmd/vzbridgegen ./internal/vzbridge/nativegen
      - name: Verify source and vendor builds
        run: |
          repo="$PWD"
          consumer=$(mktemp -d)
          cd "$consumer"
          go mod init vendor-check
          go mod edit -require=github.com/Code-Hex/vz/v4@v4.0.0 -replace=github.com/Code-Hex/vz/v4="$repo"
          cat > main.go <<'EOF'
          package main
          import "github.com/Code-Hex/vz/v4"
          func main() {
              address, err := vz.NewRandomLocallyAdministeredMACAddress()
              if err != nil { panic(err) }
              if len(address.HardwareAddr()) != 6 { panic("invalid MAC address") }
          }
          EOF
          go mod tidy
          go build -o source-check .
          ./source-check
          go mod vendor
          go build -mod=vendor -o vendor-check .
          ./vendor-check
      - name: Build Linux
        run: make -C example/linux
      - name: Build GUI Linux
        run: make -C example/gui-linux
      - name: Build macOS
        run: make -C example/macOS
        if: runner.arch == 'ARM64'
  test:
    needs: formatting-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15-intel
        go:
        - '1.26.x'
        - '1.27.x'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Download Linux kernel
        run: make download_kernel
      - name: Unit Test
        run: make test
