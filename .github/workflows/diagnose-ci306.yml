name: Compare two-VM network and console conditions
on:
  push:
    branches: [codex/diagnose-ci306-intel]
permissions:
  contents: read
  checks: write
env:
  GOTOOLCHAIN: local
jobs:
  reproduce:
    name: two VM mode=${{ matrix.mode }}
    runs-on: macos-15-intel
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: ['original', 'nat-only', 'no-network', 'console-off']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 0f8b230847c7769663b8c2347f4f2c5f9940cc29
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: source/go.sum
      - run: make -C source download_kernel
      - name: Select the two-VM configuration
        env:
          NETWORK_MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          p = Path('source/network_device_integration_test.go')
          s = p.read_text()
          mode = os.environ['NETWORK_MODE']
          old = 'client := start(clientAttachments[0])'
          assert s.count(old) == 1
          s = s.replace(old, old + '\n\tif os.Getenv("NETWORK_MODE") != "full" { return }')
          if mode in ('nat-only', 'no-network'):
              old = '\trun(peer, "ip addr add 192.0.2.2/24 dev eth1 && ip link set eth1 up && ip addr add 198.51.100.2/24 dev eth2 && ip link set eth2 up")'
              assert s.count(old) == 1
              s = s.replace(old, '')
              old = '\t\t\tattachments = append([]vz.NetworkDeviceAttachment{nat}, attachments...)'
              assert s.count(old) == 1
              s = s.replace(old, '\t\t\tattachments = []vz.NetworkDeviceAttachment{nat}')
          if mode == 'no-network':
              s = s.replace('config.SetNetworkDevicesVirtualMachineConfiguration(devices)', 'config.SetNetworkDevicesVirtualMachineConfiguration(nil)')
          p.write_text(s)
          if mode == 'console-off':
              p = Path('source/virtualization_test.go')
              s = p.read_text()
              old = 'func setupConsoleConfig(config *vz.VirtualMachineConfiguration) error {'
              assert s.count(old) == 1
              s = s.replace(old, old + '\n\tif os.Getenv("NETWORK_MODE") == "console-off" { return nil }')
              p.write_text(s)
          PYCODE
          gofmt -w source/network_device_integration_test.go source/virtualization_test.go
          git -C source diff --check
      - name: Compare the original guest test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACE_NAME: ci306-two-vm-${{ matrix.mode }}
          TRACE_SOURCE_DIR: ${{ github.workspace }}/source
          TRACE_PATTERN: '^TestRuntimeNetworkConnection$'
          TRACE_COUNT: '5'
          CI306_NO_BARRIERS: '1'
          NETWORK_MODE: ${{ matrix.mode }}
        run: python3 .github/scripts/probe-ci306.py
