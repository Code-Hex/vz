name: Isolate the native socket device
on:
  push:
    branches: [codex/diagnose-ci306-intel]
    paths: ['.github/workflows/diagnose-ci306-socket-device.yml']
permissions:
  contents: read
  checks: write
jobs:
  reproduce:
    name: native socket device=${{ matrix.socket }} without Connect
    runs-on: macos-15-intel
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        socket: ['0', '1']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: make download_kernel
      - name: Build the native probe and independent supervisor
        run: |
          xcrun clang -fno-objc-arc -fblocks -Wall -Wextra -Werror -mmacosx-version-min=12.0 -framework Foundation -framework Virtualization .github/scripts/native-pair-no-connect-ci306.m -o "$RUNNER_TEMP/native-pair-ci306"
          xcrun clang -Wall -Wextra -Werror .github/scripts/ci306-supervisor.c -o "$RUNNER_TEMP/ci306-supervisor"
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'native.entitlements').write_text('<?xml version="1.0"?><plist version="1.0"><dict><key>com.apple.security.virtualization</key><true/></dict></plist>')
          PYCODE
          codesign --force --entitlements "$RUNNER_TEMP/native.entitlements" -s - "$RUNNER_TEMP/native-pair-ci306"
      - name: Run ten pairs without creating connections
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACE_NAME: ci306-native-device-${{ matrix.socket }}-no-connect
          TRACE_NATIVE_PAIR: '1'
          TRACE_SUPERVISOR: '1'
          CI306_NO_BARRIERS: '1'
          NAT: '1'
          DGRAM: '0'
          COUNT: '10'
          CONSOLE: '0'
          CONNECT: '0'
          SOCKET_DEVICE: ${{ matrix.socket }}
        run: python3 -u .github/scripts/probe-ci306.py
      - name: Read the local supervisor journal
        if: always()
        run: cat "$RUNNER_TEMP/ci306-watch.journal"
