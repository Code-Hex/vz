name: Diagnose Intel socket lifetime
on:
  push:
    branches: [codex/diagnose-ci306-intel]
permissions:
  contents: read
  checks: write
env:
  GOTOOLCHAIN: local
jobs:
  reproduce:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: make download_kernel
      - name: Record socket lifecycle outside the runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACE_NAME: ci306-intel-go126-progress
        run: python3 .github/scripts/probe-ci306.py
