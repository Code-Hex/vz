name: VMNet lifetime diagnosis
on:
  push:
    branches:
      - codex/diagnose-vmnet-stacks-316
jobs:
  go-vmnet:
    runs-on: macos-26-intel
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Download Linux kernel
        run: make download_kernel
      - name: Capture VMNet stacks and native releases
        timeout-minutes: 5
        env:
          GOTRACEBACK: system
        run: |
          diagnostics="$RUNNER_TEMP/vz-lifetime-diagnostics"
          mkdir -p "$diagnostics"
          touch "$diagnostics/host-health.log" "$diagnostics/native-lifetime.log" "$diagnostics/goroutines.log" "$diagnostics/stack-control.log"
          ln -s "$diagnostics/native-lifetime.log" /tmp/vz-316-native-lifetime.log
          ln -s "$diagnostics/goroutines.log" /tmp/vz-316-goroutines.log
          ln -s "$diagnostics/stack-control.log" /tmp/vz-316-stack-control.log
          python3 .github/scripts/watch-vmnet.py "$diagnostics" &
          witness=$!
          tail -n +1 -F "$diagnostics/host-health.log" "$diagnostics/native-lifetime.log" "$diagnostics/goroutines.log" "$diagnostics/stack-control.log" &
          reader=$!
          cleanup() {
            kill "$witness" "$reader" 2>/dev/null || true
            wait "$witness" "$reader" 2>/dev/null || true
            rm -f /tmp/vz-316-native-lifetime.log /tmp/vz-316-goroutines.log /tmp/vz-316-stack-control.log
          }
          trap cleanup EXIT
          sw_vers
          set -o pipefail
          go test -exec "go run \"$PWD/cmd/codesign\" -diagnostics \"$diagnostics\" -diagnostic-after 30s" . -run '^(TestVMNetNetworkDeviceAttachment|TestVMNetDHCPReservationAndGuestCommunication)$' -count 1 -timeout 1m -v -failfast 2>&1 | tee "$diagnostics/tests.log"
      - name: Save lifetime diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vmnet-lifetime-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vz-lifetime-diagnostics
          if-no-files-found: warn
          retention-days: 1
