name: Diagnose native Virtualization networking
on:
  push:
    branches: [codex/diagnose-ci306-intel]
permissions:
  contents: read
  checks: write
jobs:
  reproduce:
    name: native early=${{ matrix.early }} nonblock=${{ matrix.nonblock }}
    runs-on: macos-15-intel
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - early: '0'
            nonblock: '0'
          - early: '1'
            nonblock: '0'
          - early: '0'
            nonblock: '1'
          - early: '1'
            nonblock: '1'
    env:
      NAT: '1'
      DGRAM: '2'
      CONSOLE: '0'
      EARLY_RELEASE: ${{ matrix.early }}
      NONBLOCK: ${{ matrix.nonblock }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: make download_kernel
      - name: Build and sign native control
        run: |
          xcrun clang -fno-objc-arc -fblocks -Wall -Wextra -Werror -mmacosx-version-min=12.0 -framework Foundation -framework Virtualization .github/scripts/native-ci306.m -o "$RUNNER_TEMP/native-ci306"
          cat > "$RUNNER_TEMP/native-ci306.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.virtualization</key><true/></dict></plist>
          PLIST
          codesign --force --entitlements "$RUNNER_TEMP/native-ci306.entitlements" -s - "$RUNNER_TEMP/native-ci306"
      - name: Record native lifecycle outside the runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACE_NAME: ci306-native-early-${{ matrix.early }}-nonblock-${{ matrix.nonblock }}
          TRACE_NATIVE: '1'
        run: python3 .github/scripts/probe-ci306.py
