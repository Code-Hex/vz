name: VMNet host resource diagnosis
on:
  push:
    branches:
      - codex/diagnose-vmnet-stacks-316
jobs:
  go-vmnet:
    runs-on: macos-26-intel
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Download Linux kernel
        run: make download_kernel
      - name: Capture VMNet host resources
        timeout-minutes: 5
        env:
          GOTRACEBACK: system
        run: |
          diagnostics="$RUNNER_TEMP/vz-lifetime-diagnostics"
          mkdir -p "$diagnostics"
          touch "$diagnostics/host-health.log" "$diagnostics/host-stats.log"
          python3 .github/scripts/watch-vmnet.py "$diagnostics" &
          witness=$!
          python3 .github/scripts/vmnet-host-stats.py "$diagnostics" &
          stats=$!
          tail -n +1 -F "$diagnostics/host-health.log" "$diagnostics/host-stats.log" &
          reader=$!
          cleanup() {
            kill -KILL -- "$stats" "-$stats" 2>/dev/null || true
            kill "$witness" "$reader" 2>/dev/null || true
            wait "$stats" "$witness" "$reader" 2>/dev/null || true
          }
          trap cleanup EXIT
          sw_vers
          # Record the host baseline before starting the VM process.
          sleep 10
          set -o pipefail
          for iteration in {1..3}; do
            echo "VMNet process iteration=$iteration"
            go test -exec "go run \"$PWD/cmd/codesign\" -diagnostics \"$diagnostics\" -diagnostic-after 30s" . -run '^(TestVMNetNetworkDeviceAttachment|TestVMNetDHCPReservationAndGuestCommunication)$' -count 1 -timeout 1m -v -failfast 2>&1 | tee "$diagnostics/tests-$iteration.log"
          done
      - name: Save lifetime diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vmnet-lifetime-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vz-lifetime-diagnostics
          if-no-files-found: warn
          retention-days: 1
