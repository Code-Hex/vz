name: Measure Intel kernel timeout policy without a VM
on:
  push:
    branches: [codex/diagnose-ci306-intel]
    paths: ['.github/workflows/diagnose-ci306-timeout-policy.yml']
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Intel-only collector and pinned Apple decoder
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          xcrun clang -std=c11 -Wall -Wextra -Werror .github/scripts/stackshot-once-timeout-ci306.c -o "$RUNNER_TEMP/stackshot-once-timeout"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --output "$RUNNER_TEMP/kcdata.py" https://raw.githubusercontent.com/apple-oss-distributions/xnu/f6217f891ac0bb64f3d375211650a4c1ff8ca1ea/tools/lldbmacros/kcdata.py
          echo '9ee5193fa81863d3b02df52ff4c3cc844aba73d5295c451730c6b783f403da11  '"$RUNNER_TEMP/kcdata.py" | shasum -a 256 -c -
      - name: Read timeout constants once after running UUID verification
        run: python3 .github/scripts/timeout-policy-ci306.py
      - name: Upload encrypted diagnostics only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci306-timeout-policy-encrypted
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/timeout-policy/capture.enc
            ${{ runner.temp }}/timeout-policy/password.enc
