name: Capture encrypted SPI stackshots during native diagnostic
on:
  push:
    branches: [codex/diagnose-ci306-intel]
    paths: ['.github/workflows/diagnose-ci306-kernel-spi-stream.yml']
permissions:
  contents: read
  checks: write
jobs:
  observe:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: make download_kernel
      - name: Build unchanged native probe
        run: |
          xcrun clang -fno-objc-arc -fblocks -Wall -Wextra -Werror -mmacosx-version-min=12.0 -framework Foundation -framework Virtualization .github/scripts/native-pair-no-connect-ci306.m -o "$RUNNER_TEMP/native-pair-control"
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'native.entitlements').write_text('<?xml version="1.0"?><plist version="1.0"><dict><key>com.apple.security.virtualization</key><true/></dict></plist>')
          PYCODE
          codesign --force --entitlements "$RUNNER_TEMP/native.entitlements" -s - "$RUNNER_TEMP/native-pair-control"
      - name: Prepare stackshot helper and pinned Apple parser
        run: |
          xcrun clang -std=c11 -Wall -Wextra -Werror .github/scripts/stackshot-once-stream.c -o "$RUNNER_TEMP/stackshot-once-stream"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --output "$RUNNER_TEMP/kcdata.py" https://raw.githubusercontent.com/apple-oss-distributions/xnu/f6217f891ac0bb64f3d375211650a4c1ff8ca1ea/tools/lldbmacros/kcdata.py
          echo '9ee5193fa81863d3b02df52ff4c3cc844aba73d5295c451730c6b783f403da11  '"$RUNNER_TEMP/kcdata.py" | shasum -a 256 -c -
      - name: Capture encrypted snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kernel-spi-stream.py
      - name: Upload encrypted snapshots only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci306-kernel-spi-encrypted
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/ci306-kernel-spi-encrypted/*.json
