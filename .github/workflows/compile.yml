name: Native VMNet diagnosis
on:
  push:
    branches:
      - codex/diagnose-native-vmnet-316
jobs:
  native-vmnet:
    runs-on: macos-26-intel
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download Linux kernel
        run: make download_kernel
      - name: Build and sign native probe
        run: |
          xcrun clang -fobjc-arc -fblocks -mmacosx-version-min=26.0 .github/native-vmnet/main.m -framework Foundation -framework Virtualization -framework vmnet -o "$RUNNER_TEMP/native-vmnet"
          cat > "$RUNNER_TEMP/native-vmnet.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.virtualization</key><true/></dict></plist>
          PLIST
          codesign --entitlements "$RUNNER_TEMP/native-vmnet.entitlements" -s - "$RUNNER_TEMP/native-vmnet"
      - name: Run native VMNet lifecycles
        timeout-minutes: 5
        run: |
          diagnostics="$RUNNER_TEMP/native-diagnostics"
          mkdir -p "$diagnostics"
          touch "$diagnostics/host-health.log" "$diagnostics/native-tests.log"
          python3 .github/scripts/watch-vmnet.py "$diagnostics" &
          witness=$!
          tail -n +1 -F "$diagnostics/host-health.log" "$diagnostics/native-tests.log" &
          reader=$!
          cleanup() {
            kill "$witness" "$reader" 2>/dev/null || true
            wait "$witness" "$reader" 2>/dev/null || true
          }
          trap cleanup EXIT
          sw_vers
          ifconfig
          netstat -rn
          python3 .github/scripts/run-native-vmnet.py "$diagnostics" "$RUNNER_TEMP/native-vmnet" "$PWD/testdata/Image" "$PWD/testdata/initramfs.cpio.gz"
          python3 .github/scripts/run-native-vmnet.py "$diagnostics" "$RUNNER_TEMP/native-vmnet" "$PWD/testdata/Image" "$PWD/testdata/initramfs.cpio.gz" --release-configuration
      - name: Save native diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-vmnet-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-diagnostics
          if-no-files-found: warn
          retention-days: 1
