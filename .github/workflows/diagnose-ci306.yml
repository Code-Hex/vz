name: Bisect original network test stages
on:
  push:
    branches: [codex/diagnose-ci306-intel]
permissions:
  contents: read
  checks: write
env:
  GOTOOLCHAIN: local
jobs:
  reproduce:
    name: original network stage=${{ matrix.stage }}
    runs-on: macos-15-intel
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stage: ['boot', 'peer-up', 'pair', 'full']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 0f8b230847c7769663b8c2347f4f2c5f9940cc29
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: source/go.sum
      - run: make -C source download_kernel
      - name: Limit the test to its selected prefix
        env:
          NETWORK_STAGE: ${{ matrix.stage }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          p = Path('source/network_device_integration_test.go')
          s = p.read_text()
          stage = os.environ['NETWORK_STAGE']
          markers = {
              'boot': 'peer := start(peerAttachments...)',
              'peer-up': 'run(peer, "ip addr add 192.0.2.2/24 dev eth1 && ip link set eth1 up && ip addr add 198.51.100.2/24 dev eth2 && ip link set eth2 up")',
              'pair': 'client := start(clientAttachments[0])',
          }
          if stage in markers:
              old = '\t' + markers[stage]
              assert s.count(old) == 1
              s = s.replace(old, old + '\n\tif os.Getenv("NETWORK_STAGE") != "full" { return }')
              p.write_text(s)
          PYCODE
          gofmt -w source/network_device_integration_test.go
          git -C source diff --check
      - name: Compare the original guest test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACE_NAME: ci306-network-stage-${{ matrix.stage }}
          TRACE_SOURCE_DIR: ${{ github.workspace }}/source
          TRACE_PATTERN: '^TestRuntimeNetworkConnection$'
          TRACE_COUNT: '5'
          CI306_NO_BARRIERS: '1'
          NETWORK_STAGE: ${{ matrix.stage }}
        run: python3 .github/scripts/probe-ci306.py
