name: Diagnose Intel Hypervisor CI 312

on:
  push:
    branches:
      - codex/diagnose-ci312-intel
    paths:
      - internal/ci312diag/hv_control.c
      - .github/workflows/diagnose-ci312-hv.yml

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: macos-26-intel
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        mode: [active, park]
    name: ${{ matrix.mode }}
    env:
      HV_CONTROL_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and sign Hypervisor control
        run: |
          set -euo pipefail
          source_file=internal/ci312diag/hv_control.c
          source_digest=$(shasum -a 256 "$source_file" | cut -d ' ' -f 1)
          xcrun clang -target x86_64-apple-macos12 -std=c11 -Wall -Wextra -Werror \
            "-DHV_CONTROL_SOURCE_SHA=\"$source_digest\"" "$source_file" \
            -framework Hypervisor -o "$RUNNER_TEMP/hv-control"
          cat > "$RUNNER_TEMP/hypervisor.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.hypervisor</key>
            <true/>
          </dict>
          </plist>
          PLIST
          codesign --force --sign - --entitlements "$RUNNER_TEMP/hypervisor.entitlements" "$RUNNER_TEMP/hv-control"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/hv-control"
          codesign --display --entitlements - "$RUNNER_TEMP/hv-control"
      - name: Run Hypervisor control
        run: '"$RUNNER_TEMP/hv-control" "$HV_CONTROL_MODE" 10'
