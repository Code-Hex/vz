name: Compare native two VM configurations
on:
  push:
    branches: [codex/diagnose-ci306-intel]
permissions:
  contents: read
  checks: write
env:
  GOTOOLCHAIN: local
jobs:
  reproduce:
    name: native two VM DGRAM=${{ matrix.datagrams }}
    runs-on: macos-15-intel
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        datagrams: ['0', '2']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: make download_kernel
      - name: Build the independent native probe
        run: |
          xcrun clang -fno-objc-arc -fblocks -Wall -Wextra -Werror -mmacosx-version-min=12.0 -framework Foundation -framework Virtualization .github/scripts/native-pair-ci306.m -o "$RUNNER_TEMP/native-pair-ci306"
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'native.entitlements').write_text('<?xml version="1.0"?><plist version="1.0"><dict><key>com.apple.security.virtualization</key><true/></dict></plist>')
          PYCODE
          codesign --force --entitlements "$RUNNER_TEMP/native.entitlements" -s - "$RUNNER_TEMP/native-pair-ci306"
      - name: Run ten pairs without Go or purego
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACE_NAME: ci306-native-pair-dgram-${{ matrix.datagrams }}
          TRACE_NATIVE_PAIR: '1'
          CI306_NO_BARRIERS: '1'
          NAT: '1'
          DGRAM: ${{ matrix.datagrams }}
          COUNT: '10'
          CONSOLE: '0'
          NONBLOCK: '0'
          EARLY_RELEASE: '0'
        run: python3 -u .github/scripts/probe-ci306.py
