name: Diagnose acknowledged network transitions
on:
  push:
    branches: [codex/diagnose-ci306-intel]
permissions:
  contents: read
  checks: write
env:
  GOTOOLCHAIN: local
jobs:
  reproduce:
    name: Go retain=${{ matrix.retain }} close-first=${{ matrix.close }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - retain: '0'
            close: '0'
          - retain: '1'
            close: '0'
          - retain: '0'
            close: '1'
          - retain: '1'
            close: '1'
    env:
      CI306_RETAIN_NATIVE: ${{ matrix.retain }}
      CI306_CLOSE_FIRST: ${{ matrix.close }}
      CI306_NO_BARRIERS: '1'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: make download_kernel
      - name: Acknowledge each network operation before executing it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACE_NAME: ci306-go-retain-${{ matrix.retain }}-close-${{ matrix.close }}
          TRACE_PATTERN: '^TestRuntimeNetworkConnection$'
          TRACE_COUNT: '5'
        run: python3 .github/scripts/probe-ci306.py
