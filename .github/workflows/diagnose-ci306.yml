name: Diagnose acknowledged network transitions
on:
  push:
    branches: [codex/diagnose-ci306-intel]
permissions:
  contents: read
  checks: write
env:
  GOTOOLCHAIN: local
jobs:
  reproduce:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: make download_kernel
      - name: Acknowledge each network operation before executing it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACE_NAME: ci306-network-acknowledged
          TRACE_PATTERN: '^TestRuntimeNetworkConnection$'
          TRACE_COUNT: '3'
        run: python3 .github/scripts/probe-ci306.py
