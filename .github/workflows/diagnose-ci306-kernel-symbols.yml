name: Read the exact Intel kernel and available FBT probes
on:
  push:
    branches: [codex/diagnose-ci306-intel]
    paths: ['.github/workflows/diagnose-ci306-kernel-symbols.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Collect bounded kernel diagnostics without starting a VM
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, secrets, shutil, signal, subprocess, tarfile, time
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'kernel-capability'
          raw = root / 'raw'
          raw.mkdir(parents=True, mode=0o700)
          commands = [
              ('kernel-uuid', ['/usr/bin/xcrun', 'dwarfdump', '--uuid', '/System/Library/Kernels/kernel']),
              ('kernel-nm', ['/usr/bin/xcrun', 'nm', '-n', '/System/Library/Kernels/kernel']),
              ('kernel-layout', ['/usr/bin/xcrun', 'otool', '-l', '/System/Library/Kernels/kernel']),
              ('fbt-mp', ['/usr/bin/sudo', '-n', '/usr/sbin/dtrace', '-l', '-n', 'fbt::mp_cpus_call1:entry']),
              ('fbt-pmap', ['/usr/bin/sudo', '-n', '/usr/sbin/dtrace', '-l', '-n', 'fbt::pmap_flush_tlbs:entry']),
              ('fbt-applehv', ['/usr/bin/sudo', '-n', '/usr/sbin/dtrace', '-l', '-n', 'fbt:AppleHV::entry']),
          ]
          results = []
          for name, argv in commands:
              began = time.monotonic()
              with (raw / (name + '.log')).open('wb') as output:
                  child = subprocess.Popen(argv, stdout=output, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      code = child.wait(timeout=45)
                      status = 'exited'
                  except subprocess.TimeoutExpired:
                      subprocess.run(['/usr/bin/sudo', '-n', '/bin/kill', '-KILL', '--', '-' + str(child.pid)], timeout=5, check=False)
                      code = child.wait(timeout=5)
                      status = 'timed_out'
              results.append({'name': name, 'status': status, 'returncode': code, 'seconds': round(time.monotonic() - began, 3)})
          shutil.copyfile('/System/Library/Kernels/kernel', raw / 'kernel.macho')
          summary = {'results': results, 'kernel_bytes': (raw / 'kernel.macho').stat().st_size}
          (raw / 'summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary))
          archive = root / 'raw.tar.gz'
          with tarfile.open(archive, 'w:gz') as out:
              out.add(raw, arcname='raw')
          password = root / 'password'
          password.write_text(secrets.token_hex(32))
          password.chmod(0o600)
          subprocess.run(['/usr/bin/openssl', 'enc', '-aes-256-cbc', '-pbkdf2', '-iter', '100000', '-salt', '-in', str(archive), '-out', str(root / 'capture.enc'), '-pass', 'file:' + str(password)], check=True)
          subprocess.run(['/usr/bin/openssl', 'pkeyutl', '-encrypt', '-pubin', '-inkey', '.github/scripts/observer-public.pem', '-pkeyopt', 'rsa_padding_mode:oaep', '-in', str(password), '-out', str(root / 'password.enc')], check=True)
          password.unlink()
          print('encrypted_capture_sha256=' + hashlib.sha256((root / 'capture.enc').read_bytes()).hexdigest())
          PYCODE
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ci306-kernel-symbols-encrypted
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/kernel-capability/capture.enc
            ${{ runner.temp }}/kernel-capability/password.enc
