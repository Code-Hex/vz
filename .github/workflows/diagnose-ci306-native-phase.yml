name: Compare phase-gated native VM lifecycle modes
on:
  push:
    branches: [codex/diagnose-ci306-intel]
    paths: ['.github/workflows/diagnose-ci306-native-phase.yml']
permissions:
  contents: read
  checks: write
jobs:
  observe:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        retain_stopped: [0, 1]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: make download_kernel
      - name: Build phase-gated native probe
        run: |
          xcrun clang -fno-objc-arc -fblocks -Wall -Wextra -Werror -mmacosx-version-min=12.0 -framework Foundation -framework Virtualization .github/scripts/native-phase-ci306.m -o "$RUNNER_TEMP/native-phase-control"
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'native.entitlements').write_text('<?xml version="1.0"?><plist version="1.0"><dict><key>com.apple.security.virtualization</key><true/></dict></plist>')
          PYCODE
          codesign --force --entitlements "$RUNNER_TEMP/native.entitlements" -s - "$RUNNER_TEMP/native-phase-control"
      - name: Capture phase checkpoints with independent observer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI306_OBSERVER_RECEIVER: ${{ secrets.CI306_OBSERVER_RECEIVER }}
          RETAIN_STOPPED: ${{ matrix.retain_stopped }}
        run: python3 .github/scripts/launchd-phase-wrapper-ci306.py
      - name: Upload encrypted snapshots only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci306-kernel-fbt-encrypted-${{ matrix.retain_stopped }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/ci306-kernel-fbt-encrypted/*.json
