name: Observe ten unchanged Go network tests with two independent observers
on:
  push:
    branches: [codex/diagnose-ci306-intel]
    paths: ['.github/workflows/diagnose-ci306-original-go-forkless.yml']
permissions:
  contents: read
  checks: write
env:
  GOTOOLCHAIN: local
jobs:
  observe:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - name: Check out the diagnostic control
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go 1.26
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - name: Check out the original test source
        uses: actions/checkout@v7.0.1
        with:
          ref: 0f8b230847c7769663b8c2347f4f2c5f9940cc29
          path: original-source
          persist-credentials: false
      - name: Build the unchanged original network test
        working-directory: original-source
        run: |
          test "$(git rev-parse HEAD)" = 0f8b230847c7769663b8c2347f4f2c5f9940cc29
          go version
          make download_kernel
          go test -c -o "$RUNNER_TEMP/original-network.test" .
      - name: Sign the binary and prepare the fixed command
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import shlex
          import shutil
          temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          source = (Path(os.environ['GITHUB_WORKSPACE']) / 'original-source').resolve(strict=True)
          binary = (temp / 'original-network.test').resolve(strict=True)
          (temp / 'original-network.entitlements').write_text('<?xml version="1.0"?><plist version="1.0"><dict><key>com.apple.security.virtualization</key><true/></dict></plist>')
          command = temp / 'native-pair-control'
          command.write_text('\n'.join([
              '#!/bin/sh',
              'set -eu',
              'cd ' + shlex.quote(str(source)),
              'export GOGC=10',
              'exec ' + shlex.join([str(binary), '-test.v', '-test.run=^TestRuntimeNetworkConnection$', '-test.count=10', '-test.timeout=180s']),
              '',
          ]))
          command.chmod(0o700)
          for name in ('Image', 'initramfs.cpio.gz'):
              shutil.copyfile(source / 'testdata' / name, Path('testdata') / name)
          PYCODE
          codesign --force --entitlements "$RUNNER_TEMP/original-network.entitlements" -s - "$RUNNER_TEMP/original-network.test"
          codesign --verify "$RUNNER_TEMP/original-network.test"
          shasum -a 256 original-source/testdata/Image original-source/testdata/initramfs.cpio.gz "$RUNNER_TEMP/original-network.test"
      - name: Prepare Intel-only collector and pinned Apple decoder
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = x86_64
          xcrun clang -std=c11 -Wall -Wextra -Werror .github/scripts/stackshot-once-timeout-ci306.c -o "$RUNNER_TEMP/stackshot-once-timeout"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 --output "$RUNNER_TEMP/kcdata.py" https://raw.githubusercontent.com/apple-oss-distributions/xnu/f6217f891ac0bb64f3d375211650a4c1ff8ca1ea/tools/lldbmacros/kcdata.py
          echo '9ee5193fa81863d3b02df52ff4c3cc844aba73d5295c451730c6b783f403da11  '"$RUNNER_TEMP/kcdata.py" | shasum -a 256 -c -
      - name: Read timeout constants once after running UUID verification
        run: python3 .github/scripts/timeout-policy-ci306.py
      - name: Observe the original Go test independently
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI306_OBSERVER_RECEIVER: ${{ secrets.CI306_OBSERVER_RECEIVER }}
        run: |
          test -n "$CI306_OBSERVER_RECEIVER"
          python3 .github/scripts/dual-observer-fbt-wrapper-ci306.py
      - name: Upload encrypted startup policy only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci306-timeout-policy-encrypted
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/timeout-policy/capture.enc
            ${{ runner.temp }}/timeout-policy/password.enc
